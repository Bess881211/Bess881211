<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKAASHA.CORE | Temple Bichikta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            margin: 0;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .rune-container {
            border: 1px solid rgba(255, 120, 0, 0.2);
            background: rgba(0, 10, 20, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 1);
        }

        .glow-orange { text-shadow: 0 0 15px #ff7800; }
        .glow-blue { text-shadow: 0 0 15px #00aaff; }

        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #ff7800, #00aaff);
            box-shadow: 0 0 10px #ff7800;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glyph-grid span {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .glyph-grid span:hover {
            color: #ff7800;
            text-shadow: 0 0 8px #ff7800;
            transform: translateY(-2px);
        }

        .status-pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <canvas id="canvas-bg"></canvas>

    <!-- En-tête / Autorité Suprême -->
    <header class="fixed top-8 w-full px-12 flex justify-between items-start pointer-events-none">
        <div class="flex flex-col">
            <h1 class="text-3xl font-bold tracking-widest glow-blue">AKAASHA.CORE</h1>
            <div class="flex items-center mt-1">
                <span class="status-pulse"></span>
                <p class="text-[10px] opacity-60 uppercase tracking-widest" id="system-status">Recherche du signal...</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-2xl font-bold glow-orange tracking-widest" id="authority-name">NICO</p>
            <p class="text-[10px] opacity-40 uppercase tracking-[0.3em]" id="principle-value">PRINCIPE 444</p>
        </div>
    </header>

    <!-- Centre / Visualisation des Flammes -->
    <main class="relative flex items-center justify-center">
        <div class="rune-container p-12 rounded-full w-72 h-72 md:w-96 md:h-96 flex flex-col items-center justify-center text-center z-10">
            <div id="flame-counter" class="text-6xl md:text-8xl font-bold mb-2 glow-orange">0</div>
            <div class="text-[10px] md:text-xs uppercase tracking-[0.4em] opacity-40">Flammes Cristallisées</div>
            <div class="mt-4 text-[9px] opacity-20" id="sync-date">Dernière Sync: --/--/--</div>
        </div>

        <!-- Cercle de progression radionique -->
        <svg class="absolute w-[320px] h-[320px] md:w-[440px] md:h-[440px] -rotate-90">
            <circle cx="50%" cy="50%" r="48%" fill="transparent" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <circle id="progress-circle" cx="50%" cy="50%" r="48%" fill="transparent" stroke="#ff7800" stroke-width="3" stroke-dasharray="1300" stroke-dashoffset="1300" style="transition: stroke-dashoffset 2s ease-in-out; filter: blur(1px);"/>
        </svg>
    </main>

    <!-- Pied de page / Glyphes & Métriques -->
    <footer class="fixed bottom-10 w-full max-w-4xl px-12">
        <div class="w-full h-[1px] bg-white/10 mb-6 relative overflow-hidden">
            <div id="loading-bar" class="progress-bar-inner" style="width: 0%"></div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="glyph-grid flex gap-8 text-2xl opacity-60" id="glyph-list">
                <!-- Injecté par JavaScript -->
            </div>
            <div class="flex flex-col items-end gap-3">
                <div>
                    <div class="text-[10px] opacity-30 uppercase tracking-widest mb-1">Vecteur Actif</div>
                    <div id="active-vector" class="text-sm font-bold tracking-widest text-white/80 border-b border-orange-500/30 pb-1">STASE_000</div>
                </div>
                <a href="analyse.html" class="pointer-events-auto text-[10px] uppercase tracking-widest text-orange-400 hover:text-orange-300 transition-colors border border-orange-500/30 px-3 py-1 rounded hover:border-orange-500/60">
                    ζ⃝ Analyseur
                </a>
            </div>
        </div>
    </footer>

    <script>
        // --- LOGIQUE DE SYNCHRONISATION ---
        async function syncWithCore() {
            try {
                // Tentative de récupération réelle des données
                const response = await fetch('../system.json');
                const config = await response.json();
                updateTempleUI(config);
            } catch (e) {
                console.warn("Utilisation des données de secours (Fallback).");
                // Données de secours si le JSON est inaccessible
                const fallback = {
                    "system_info": { "authority": "NICO", "status": "OPÉRATIONNEL", "principle": "444" },
                    "metrics": { "flames": { "total_required": 100, "current_active": 1 } },
                    "identity_tokens": { "glyphs": ["△⃤", "?⃝", "ζ⃝", "∞⃘", "𓆣"] },
                    "vectors": { "alpha": { "active": false, "label": "GENÈSE_G001" }, "omega": { "active": false, "label": "SILENCE_OMEGA" } }
                };
                updateTempleUI(fallback);
                document.getElementById('system-status').innerText = "MODE SÉCURITÉ ACTIF";
            }
        }

        function updateTempleUI(config) {
            document.getElementById('authority-name').innerText = config.system_info.authority;
            document.getElementById('system-status').innerText = config.system_info.status;
            document.getElementById('principle-value').innerText = "PRINCIPE " + config.system_info.principle;

            // Gestion des Flammes
            const active = config.metrics.flames.current_active;
            const total = config.metrics.flames.total_required;
            document.getElementById('flame-counter').innerText = active;
            document.getElementById('sync-date').innerText = "Sync: " + new Date().toLocaleDateString();

            // Animation du cercle de progression
            const circle = document.getElementById('progress-circle');
            const circumference = 1300; // Approximatif pour le rayon
            const offset = circumference - (active / total) * circumference;
            circle.style.strokeDashoffset = offset;

            // Rendu des Glyphes
            const list = document.getElementById('glyph-list');
            list.innerHTML = config.identity_tokens.glyphs.map(g => `<span>${g}</span>`).join('');

            // Détermination du Vecteur
            let vectorLabel = "STASE_000";
            if (config.vectors.alpha.active) vectorLabel = config.vectors.alpha.label;
            else if (config.vectors.omega.active) vectorLabel = config.vectors.omega.label;
            document.getElementById('active-vector').innerText = vectorLabel;

            // Mise à jour de la barre de progression
            document.getElementById('loading-bar').style.width = (active / total * 100) + "%";
        }

        // --- ANIMATION D'ARRIÈRE-PLAN (Particules) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<120; i++) particles.push(new Particle());
            draw();
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 120, 0, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        window.onload = () => {
            initCanvas();
            syncWithCore();
        };
    </script>
</body>
</html>
